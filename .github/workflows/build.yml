name: Build

on:
  push:
  pull_request:

# Automatically cancel previous runs of this workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build inside the remill-template dependency image (LLVM 19 + remill's
  # dependencies are prebuilt in /dependencies). Only Z3, protobuf and doctest
  # are installed from the Ubuntu packages.
  docker:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/llvmparty/remill-template/dependencies:22.04-llvm19.1.7-remill2026.03.20
    steps:
        - name: Checkout
          uses: actions/checkout@v5
          with:
            submodules: recursive

        - name: Install dependencies
          run: |
            git config --global --add safe.directory '*'
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libz3-dev libprotobuf-dev protobuf-compiler doctest-dev

        - name: Build anvill
          run: |
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            cmake --build build

        - name: Test
          run: ctest --test-dir build --output-on-failure
