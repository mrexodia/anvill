name: Build

on:
  push:
  pull_request:
  schedule:
    # Keep dependency caches warm; GitHub evicts caches that are not accessed.
    - cron: 0 0 */5 * *

# Automatically cancel previous runs of this workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build inside the remill-template dependency image (LLVM 19 + remill's
  # dependencies are preinstalled in /dependencies). Only the anvill-specific
  # dependencies are built on top of it.
  docker:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/llvmparty/remill-template/dependencies:22.04-llvm19.1.7-remill2026.03.20
    steps:
        - name: Checkout
          uses: actions/checkout@v5
          with:
            submodules: recursive

        - name: Configure git
          run: git config --global --add safe.directory '*'

        - name: Hash dependencies
          id: hash-dependencies
          run: python3 dependencies/hash.py --debug >> "$GITHUB_OUTPUT"
          shell: bash

        - name: Cache dependencies
          id: cache-dependencies
          uses: actions/cache@v5
          with:
            path: dependencies/install
            key: dependencies-docker-llvm19-${{ runner.arch }}-${{ steps.hash-dependencies.outputs.file_hash }}
            restore-keys: |
              dependencies-docker-llvm19-${{ runner.arch }}-${{ steps.hash-dependencies.outputs.restore_hash }}

        - name: Build dependencies
          if: steps.cache-dependencies.outputs.cache-hit != 'true'
          run: |
            cmake -G Ninja -S dependencies -B dependencies/build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DUSE_EXTERNAL_LLVM=ON -DBUILD_REMILL_DEPENDENCIES=OFF
            cmake --build dependencies/build

        - name: Build anvill
          run: |
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            cmake --build build

        - name: Test
          run: ctest --test-dir build --output-on-failure
